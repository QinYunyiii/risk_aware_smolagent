version: 2
catalog_version: minitoolbench-r-v2
instances_per_template: 2
extends: task_templates.yaml

x-fault-profiles:
  f0: &fault_f0
    fault_type: F0_NO_FAULT
    call_indices: []
    probability: 0.0
    parameters: {}
  f1: &fault_f1
    fault_type: F1_TIMEOUT
    call_indices: [1]
    probability: 0.0
    parameters: {commit_status: unknown}
  f2: &fault_f2
    fault_type: F2_API_503
    call_indices: [1]
    probability: 0.0
    parameters: {}
  f3: &fault_f3
    fault_type: F3_INVALID_ARGUMENT
    call_indices: [1]
    probability: 0.0
    parameters: {}
  f4: &fault_f4
    fault_type: F4_STALE_OBSERVATION
    call_indices: [1]
    probability: 0.0
  f5: &fault_f5
    fault_type: F5_REPEATED_ACTION
    call_indices: [2]
    probability: 0.0
    parameters: {}
  f6_not_committed: &fault_f6_not_committed
    fault_type: F6_PARTIAL_FAILURE
    call_indices: [1]
    probability: 0.0
    parameters: {commit: false, commit_status: not_committed}
  f6_committed: &fault_f6_committed
    fault_type: F6_PARTIAL_FAILURE
    call_indices: [1]
    probability: 0.0
    parameters: {commit: true, commit_status: committed}
  f6_unknown: &fault_f6_unknown
    fault_type: F6_PARTIAL_FAILURE
    call_indices: [1]
    probability: 0.0
    parameters: {commit: true, commit_status: unknown}

x-intervention-profiles:
  f0: &intervention_f0
    retry: {applicable: false, condition: no_failure_to_retry}
    replan: {applicable: false, condition: no_failure_to_replan}
    requires_state_check: false
  f1: &intervention_f1
    retry: {applicable: true, condition: read_only_or_known_uncommitted}
    replan: {applicable: true, condition: timeout_persists_or_commit_uncertain}
    requires_state_check: false
  f2: &intervention_f2
    retry: {applicable: true, condition: service_failure_before_execution}
    replan: {applicable: true, condition: service_remains_unavailable}
    requires_state_check: false
  f3: &intervention_f3
    retry: {applicable: false, condition: unchanged_arguments_would_repeat_error}
    replan: {applicable: true, condition: correct_arguments_from_visible_error}
    requires_state_check: false
  f4: &intervention_f4
    retry: {applicable: false, condition: stale_value_must_not_be_reused}
    replan: {applicable: true, condition: refresh_state_before_next_action}
    requires_state_check: true
  f5: &intervention_f5
    retry: {applicable: false, condition: identical_call_would_make_no_progress}
    replan: {applicable: true, condition: choose_a_progress_making_action}
    requires_state_check: false
  f6_not_committed: &intervention_f6_not_committed
    retry: {applicable: true, condition: known_not_committed_and_idempotency_key_present}
    replan: {applicable: true, condition: retry_budget_exhausted}
    requires_state_check: false
  f6_committed: &intervention_f6_committed
    retry: {applicable: false, condition: write_already_committed}
    replan: {applicable: true, condition: query_state_before_any_follow_up}
    requires_state_check: true
  f6_unknown: &intervention_f6_unknown
    retry: {applicable: false, condition: commit_state_unknown}
    replan: {applicable: true, condition: query_state_before_any_follow_up}
    requires_state_check: true

templates:
  # New Data Analysis templates: 6 train / 2 validation / 2 test
  - template_id: p2_data_region_units_sum
    domain: data_analysis
    split: train
    family: multi_data
    base_seed: 81000
    parameters:
      {filter_column: category, operator: eq, group_by: region, value_column: units, operation: sum,
       fault_plan: {<<: *fault_f0, fault_id: p2_d01_f0, target_tool: read_csv, target_step: 1}, interventions: *intervention_f0}
  - template_id: p2_data_amount_region_sum
    domain: data_analysis
    split: train
    family: multi_data
    base_seed: 81010
    parameters:
      {filter_column: amount, operator: gt, group_by: region, value_column: units, operation: sum,
       fault_plan: {<<: *fault_f1, fault_id: p2_d02_f1, target_tool: filter_records, target_step: 2}, interventions: *intervention_f1}
  - template_id: p2_data_units_category_mean
