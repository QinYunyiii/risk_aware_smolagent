[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-aware-smolagents"
version = "0.1.0"
description = "Risk-aware local tool execution with remote smolagents model workers"
requires-python = ">=3.12,<3.13"
dependencies = [
  "joblib==1.6.0",
  "lightgbm==4.7.0",
  "numpy==2.5.5",
  "openai==3.52.0",
  "PyYAML==6.0.3",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
  "smolagents[openai]==1.26.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.2.0",
  "pytest-timeout==2.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
timeout = 30

